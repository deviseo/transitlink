[package]
name = "transitlink"
version = "0.3.1"
description = "TransitLink：中转站用户客户端（登录中转站、管理 Key、一键配置 Claude Code / Codex）"
authors = ["deviseo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transitlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-deep-link = "2"
dirs = "7"
which = "8"
url = "2"
# multipart：工单里上传图片。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy", "multipart"] }
# new-api 登录密码加密（RSA-OAEP + AES-256-GCM），版本需互相匹配。
rsa = "0.9"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
# 凭证存系统钥匙串（macOS Keychain、Windows 凭据管理器、Linux Secret Service）。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-clipboard-manager = "2"
toml_edit = "0.25.18"
# 登录窗口里轮询登录状态用的计时器和单次通道（tauri 本身就在用 tokio）。
tokio = { version = "1", features = ["time", "sync", "process", "io-util", "macros"] }
# 一键安装时把系统代理交给安装命令（和 reqwest 读系统代理用的是同一套）。
hyper-util = { version = "0.1", features = ["client-proxy-system"] }
http = "1"
# 判断专属链接和站点是不是同一个域名（公共后缀列表，正确处理 .com.cn、github.io 这类后缀）。
psl = "2.1.246"
# 改 Gemini CLI、OpenCode 允许注释的 JSON 配置时保留注释和格式。
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
